<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72" role="img" aria-label="Einfach Scooter — Tuning Chips">
  <title>Einfach Scooter — Tuning Chips</title>
  <!-- Für große Darstellungen gedacht (Druck, Verpackung, Shop-Banner).
       Unter ~120px Breite wird "TUNING CHIPS" unleserlich – dort statt
       dieser Datei logo.svg mit echtem HTML-Text daneben verwenden. -->
  <defs>
    <linearGradient id="es-lock-grad" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#8ab4dc"/>
      <stop offset="1" stop-color="#5b86b4"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-width="14" stroke-linecap="round" transform="translate(-3.9 0.25) scale(0.55)">
    <path d="M 33 40 H 79 a 24 24 0 0 1 0 48 H 51" stroke="url(#es-lock-grad)"/>
    <path d="M 25 64 H 61" stroke="#8ab4dc"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="35" font-size="30" font-weight="650" letter-spacing="-0.3" fill="#f0f2f4">Einfach Scooter</text>
    <text x="74" y="56" font-size="11" font-weight="500" letter-spacing="2.8" fill="#6f9dc9">TUNING CHIPS</text>
  </g>
</svg>
